[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartrag-pro"
version = "0.3.0"
description = "Multi-user document-grounded assistant"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "streamlit>=1.45,<2",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3", "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26", "python-multipart>=0.0.20,<1", "pypdf>=5.4,<7",
  "langchain-google-genai>=2.1,<5", "langchain-openai>=0.3,<2",
  "langchain-text-splitters>=0.3,<2", "qdrant-client>=1.14,<2",
  "redis>=5.2,<8", "boto3>=1.37,<2", "httpx>=0.28,<1",
  "pymupdf>=1.26,<2", "pytesseract>=0.3.13,<1", "dramatiq[redis]>=2.0,<3",
  "psutil>=7,<8", "tiktoken>=0.9,<1",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
]

[project.optional-dependencies]
parsing = ["docling>=2.60,<3", "torch>=2.8,<3", "torchvision>=0.23,<1"]
local = ["sentence-transformers>=5,<6", "torch>=2.8,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "pre-commit>=4,<5", "reportlab>=4.3,<5", "types-requests", "boto3-stubs[s3]", "langgraph-checkpoint-sqlite>=3.0.1,<4"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=backend.app --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["backend", "frontend"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
