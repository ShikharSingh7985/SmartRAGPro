services:
  api:
    environment:
      TELEMETRY_ENABLED: "true"
      TELEMETRY_SAMPLE_RATIO: "1"
      TELEMETRY_ENDPOINT: http://otel-collector:4318/v1/traces
  worker:
    environment:
      TELEMETRY_ENABLED: "true"
      TELEMETRY_SAMPLE_RATIO: "1"
      TELEMETRY_ENDPOINT: http://otel-collector:4318/v1/traces
  dispatcher:
    environment:
      METRICS_PORT: "9102"
      TELEMETRY_ENABLED: "true"
      TELEMETRY_ENDPOINT: http://otel-collector:4318/v1/traces
      LANGFUSE_ENABLED: "false"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: [--config=/etc/otelcol/config.yml]
    volumes: ["./ops/observability/collector.yml:/etc/otelcol/config.yml:ro"]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
  tempo-init:
    image: python:3.12.12-slim
    user: "0:0"
    command: [python, -c, "import os; os.chown('/data',10001,10001)"]
    volumes: [tempo_data:/data]
    network_mode: none
  tempo:
    image: grafana/tempo:3.1.1
    user: "10001:10001"
    command: [-config.file=/etc/tempo.yml]
    volumes: ["./ops/observability/tempo.yml:/etc/tempo.yml:ro", "tempo_data:/var/tempo"]
    depends_on:
      tempo-init: {condition: service_completed_successfully}
    mem_limit: 768m
    cpus: 0.5
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.16.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=1GB]
    volumes: ["./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus_data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes: ["./.docker-local/grafana-password:/run/secrets/grafana_password:ro", "./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro", "./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro", "grafana_data:/var/lib/grafana"]
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
volumes:
  tempo_data:
  prometheus_data:
  grafana_data:
