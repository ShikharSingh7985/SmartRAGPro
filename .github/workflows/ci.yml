name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: smartrag_test
          POSTGRES_USER: smartrag
          POSTGRES_PASSWORD: ci-only-nonproduction
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U smartrag -d smartrag_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.9'
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: uv run python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
        env:
          TIKTOKEN_CACHE_DIR: .uv-cache/tiktoken
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://smartrag:ci-only-nonproduction@localhost:5432/smartrag_test
      - run: uv run python scripts/check_staged.py --all
      - name: Deterministic adversarial regression
        run: uv run python -m evaluation.security.run
      - name: Audit installed dependencies
        run: uv run pip-audit --format json --output dependency-audit.json --progress-spinner off
      - name: Audit optional locked dependencies
        run: |
          uv export --frozen --all-extras --no-emit-project --no-hashes --quiet --output-file audit-requirements.txt
          uv run pip-audit --requirement audit-requirements.txt --no-deps --disable-pip --format json --output optional-dependency-audit.json --progress-spinner off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: |
            dependency-audit.json
            optional-dependency-audit.json
            evaluation/security/policy-results.json
  containers-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate host HTTPS proxy example without network access
        run: >-
          docker run --rm --network none
          -v "$PWD/ops/deployment/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e PUBLIC_DOMAIN=app.example.invalid -e API_DOMAIN=api.example.invalid
          caddy:2.11.9 caddy adapt --config /etc/caddy/Caddyfile --validate > /dev/null
      - name: Build API, frontend and OCR worker
        run: |
          docker build --target runtime -t smartrag-api .
          docker build --target frontend -t smartrag-frontend .
          docker build --target worker -t smartrag-worker .
      - name: Start disposable dependencies
        run: docker compose -p smartrag-test -f docker-compose.test.yml up -d --wait
      - name: Full integration, migration, retrieval and security regressions
        run: >-
          docker compose -p smartrag-test -f docker-compose.test.yml --profile tests
          run --build --rm tests
      - name: Stop disposable dependencies
        if: always()
        run: docker compose -p smartrag-test -f docker-compose.test.yml down --volumes
