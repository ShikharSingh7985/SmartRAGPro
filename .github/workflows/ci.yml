name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: smartrag_test
          POSTGRES_USER: smartrag
          POSTGRES_PASSWORD: ci-only-nonproduction
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U smartrag -d smartrag_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.9'
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://smartrag:ci-only-nonproduction@localhost:5432/smartrag_test
      - run: uv run python scripts/check_staged.py --all
