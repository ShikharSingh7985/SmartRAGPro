# Dedicated disposable integration services. These credentials are for tests only.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: smartrag_test
      POSTGRES_USER: smartrag
      POSTGRES_PASSWORD: isolated-test-only
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U smartrag -d smartrag_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["127.0.0.1:56333:6333"]
  redis:
    image: redis:7.4.12-alpine
    ports: ["127.0.0.1:56379:6379"]
  objectstore:
    image: chrislusf/seaweedfs:4.52
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: smartrag-test
      AWS_SECRET_ACCESS_KEY: isolated-test-only
    ports: ["127.0.0.1:59000:8333"]
  tests:
    profiles: [tests]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://smartrag:isolated-test-only@postgres:5432/smartrag_test
      TEST_QDRANT_URL: http://qdrant:6333
      TEST_REDIS_URL: redis://redis:6379/0
      TEST_S3_ENDPOINT: http://objectstore:8333
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_started}
      objectstore: {condition: service_started}
