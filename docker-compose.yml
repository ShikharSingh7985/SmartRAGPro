services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: smartrag
      POSTGRES_USER: smartrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U smartrag -d smartrag"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes: [qdrant_data:/qdrant/storage]
  redis:
    image: redis:7.4.12-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  objectstore:
    image: chrislusf/seaweedfs:4.52
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes: [objectstore_data:/data]
  bootstrap:
    build: .
    env_file: .env
    command: [python, -m, scripts.bootstrap]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      objectstore: {condition: service_started}
      qdrant: {condition: service_started}
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: [python, -m, backend.app.workers.ingestion]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 120s
  frontend:
    build: .
    environment:
      API_BASE_URL: http://api:8000
    command: [streamlit, run, frontend/app.py, --server.address=0.0.0.0, --server.port=8501, --browser.gatherUsageStats=false, --server.maxUploadSize=20]
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped
volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  objectstore_data:
